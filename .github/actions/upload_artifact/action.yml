name: Upload Proofs Heatmap 
description: Upload a heatmap of proofs to github pages

runs:
  using: composite
  steps:
        - name: Setup Pages
          uses: actions/configure-pages@v5
        - name: Download all artifacts
          uses: actions/download-artifact@v4
          with:
            path: reports
        - name: Build index
          shell: bash
          run: |
            mkdir -p reports
            INDEX=reports/index.html
            echo "<html><body>" > $INDEX
            echo "<h1>EasyCrypt Proof Heatmaps</h1>" >> $INDEX
            echo "<ul>" >> $INDEX

            for f in reports/*/*.html; do
              relpath=${f#reports/}
              name=$(basename "$f")
              echo "<li><a href=\"$relpath\">$name</a></li>" >> "$INDEX"
            done

            echo "</ul></body></html>" >> $INDEX
        - name: Upload Heatmap Artifacts
          uses: actions/upload-pages-artifact@v3
          with:
              name: heatmap-report
              path: reports/
        - name: Deploy to GitHub Pages
          id: deployment
          uses: actions/deploy-pages@v4
          with:
            artifact_name: heatmap-report
