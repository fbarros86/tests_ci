name: EasyCrypt
permissions:
  contents: read
on:
  push:
    branches:
      - main
env:
  NIXPKGS_ALLOW_UNFREE: 1
  ECRJOBS: 2

jobs:
    test_proofs:
        name: Check Proofs
        runs-on: self-hosted
        strategy:
          fail-fast: false
          # matrix:
          #   size: [ '768','1024']
          #   dir: [ 'ref', 'avx2' ]
            # type: [ 'correctness', 'safety' ] --> to add later
        steps:
        - uses: actions/checkout@v4
        - uses: cachix/install-nix-action@v31
          with:
            nix_path: nixpkgs=channel:nixos-unstable
            extra_nix_config: |
                filter-syscalls = false
        - run: nix-shell --run 'easycrypt why3config'
        # - run: nix-shell --run "make checkec_${{matrix.size}}_${{matrix.dir}}"
        - run: nix-shell --run "make checkec_768_avx2"
