name: EasyCrypt
permissions:
  contents: read
on:
  push:
    branches:
      - main
env:
  NIXPKGS_ALLOW_UNFREE: 1
  ECRJOBS: 1
  NIX_CONFIG: |
    sandbox = false

jobs:
    test_proofs:
        name: Check Proofs
        runs-on: ubuntu-latest
        strategy:
          fail-fast: false
          matrix:
            size: [ '768','1024']
            dir: [ 'ref' , 'avx2']
            # type: [ 'correctness', 'safety' ] --> to add later
        steps:
        - uses: actions/checkout@v4
        - uses: cachix/install-nix-action@v31
          with:
            nix_path: nixpkgs=channel:nixos-unstable
        - run: nix-shell --option sandbox false --run 'easycrypt why3config'
        - name: Run Proofs MLKEM${{matrix.size}}(${{matrix.dir}})
          id: ec_proofs 
          run: |
            set -o pipefail
            nix-shell --run "easycrypt runtest config/tests.config mlkem_${{matrix.size}}_${{matrix.dir}}"  2>&1 | tee proof_output.log
        - name: Generate Detailed Job Summary
          if: always() 
          run: |
            echo "PROOF_JOB_OUTCOME=${{ steps.ec_proofs.outcome }}" >> $GITHUB_ENV
            python scripts/generate_summary.py \
              proof_output.log \
              "correctness" \
              "${{ matrix.size }}" \
              "${{ matrix.dir }}"

