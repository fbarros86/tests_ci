
name: MLKEM CI
permissions:
  contents: read
  pages: write
  id-token: write
on:
  workflow_dispatch:
  push:
    branches: [ "main"]
  pull_request:
    branches: ["main"]
    
env:
  NIXPKGS_ALLOW_UNFREE: 1

jobs:
    heatmap_proofs:
        name: Generate Heatmap of Proofs
        runs-on: ubuntu-latest
        strategy:
          fail-fast: false
          matrix:
            category:
            # - correctness_768_ref
            # - correctness_768_avx2
            # - correctness_1024_ref
            # - correctness_1024_avx2
            # - safety_768_avx2
            - safety_1024_avx2
            - security
            - spec
        environment:
          name: github-pages
          url: easycrypt-heatmap-reports-${{matrix.category}}
        steps:
         - uses: actions/checkout@v6
           with:
            submodules: recursive
         - name: Install Nix
           uses: cachix/install-nix-action@v31
           with:
             nix_path: nixpkgs=channel:nixos-unstable
        #  - name: Check Dependencies
        #    shell: bash
        #    run: nix-shell --run "echo Dependencies OK…"
         - name: Set Clean Path
           run: 
              CLEAN_PATH=$(echo "${{ matrix.category }}" | tr '/' '_')
              echo "PATH_PROOF=$CLEAN_PATH" >> $GITHUB_ENV
         - name: Echo myValue
           run: echo "test - $PATH_PROOF"
        #  - uses: ./.github/actions/heatmap_proofs
        #    with:
        #     category: ${{matrix.category}}
        #     path: ${{env.PATH_PROOF}}
    upload_artifact:
        name: Upload Heatmap Artifacts
        needs: heatmap_proofs
        if: always()
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v6
            with:
              submodules: recursive
          - name: Install Nix
            uses: cachix/install-nix-action@v31
            with:
              nix_path: nixpkgs=channel:nixos-unstable
          - name: Check Dependencies
            shell: bash
            run: nix-shell --run "echo Dependencies OK…"
          - uses: ./.github/actions/upload_artifact
          
          
          

