
name: MLKEM CI
permissions:
  contents: read
  pages: write
  id-token: write
on:
  workflow_dispatch:
  push:
    branches: [ "main"]
  pull_request:
    branches: ["main"]
    
env:
  NIXPKGS_ALLOW_UNFREE: 1

jobs:
    heatmap_proofs:
        name: Generate Heatmap of Proofs
        runs-on: ubuntu-latest
        strategy:
          fail-fast: false
          matrix:
            size: [ '768' ,'1024' ]
            dir: [ 'avx2']
            type: [ 'safety']
            exclude:
              - dir: 'ref'
                type: 'safety'
              - dir: 'avx2'
                type: 'correctness'
        environment:
          name: github-pages
          url: easycrypt-heatmap-reports-${{matrix.type}}-${{matrix.size}}-${{matrix.dir}}
        steps:
         - uses: actions/checkout@v6
           with:
            submodules: recursive
         - name: Install Nix
           uses: cachix/install-nix-action@v31
           with:
             nix_path: nixpkgs=channel:nixos-unstable
         - name: Check Dependencies
           shell: bash
           run: nix-shell --run "echo Dependencies OK…"
         - uses: ./.github/actions/heatmap_proofs
           with:
            type: ${{matrix.type}}
            size: ${{matrix.size}}
            dir: ${{matrix.dir}}
    upload_artifact:
        name: Upload Heatmap Artifacts
        needs: heatmap_proofs
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v6
            with:
              submodules: recursive
          - name: Install Nix
            uses: cachix/install-nix-action@v31
            with:
              nix_path: nixpkgs=channel:nixos-unstable
          - name: Check Dependencies
            shell: bash
            run: nix-shell --run "echo Dependencies OK…"
          - uses: ./.github/actions/upload_artifact
          
          
          

